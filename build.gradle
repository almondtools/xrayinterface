import org.gradle.jvm.toolchain.JavaLanguageVersion

plugins {
    id 'java-library'
    id 'jacoco'
    id 'maven-publish'
    id 'signing'
    id("com.github.ben-manes.versions") version "0.54.0"
}

group = 'net.amygdalum'
description = 'An application to get controlled access to private fields and methods of Java classes'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }

    withSourcesJar()
    withJavadocJar()
}

repositories {
    mavenCentral()
    mavenLocal()
}

dependencies {
    compileOnly 'org.hamcrest:hamcrest:3.0'

    testImplementation 'org.hamcrest:hamcrest:3.0'
    testImplementation 'org.assertj:assertj-core:3.27.7'
    testImplementation 'org.junit.jupiter:junit-jupiter:6.1.3'
    testImplementation('net.amygdalum:hamcrest-extensions:0.1.21') {
        exclude group: 'org.hamcrest', module: 'hamcrest-library'
    }
    testImplementation 'org.mockito:mockito-core:5.23.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

jar {
    manifest {
        attributes(
            'Automatic-Module-Name': 'net.amygdalum.xrayinterface'
        )
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java

            pom {
                name = 'XRayInterface'
                description = 'An application to get controlled access to private fields and methods of Java classes'
                url = 'https://xrayinterface.amygdalum.net/'

                licenses {
                    license {
                        name = 'GNU Lesser General Public License v3.0'
                        url = 'https://www.gnu.org/licenses/lgpl-3.0.txt'
                    }
                }

                developers {
                    developer {
                        id = 'amygdalum'
                        name = 'Stefan Mandel'
                        email = 'mandelst@gmail.com'
                    }
                }

                scm {
                    connection = 'scm:git:https://github.com/almondtools/xrayinterface.git'
                    developerConnection = 'scm:git:https://github.com/almondtools/xrayinterface.git'
                    url = 'https://github.com/almondtools/xrayinterface'
                }
            }
        }
    }
}

signing {
    useGpgCmd()
    sign publishing.publications.mavenJava
}


tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
    options.deprecation = true
    options.compilerArgs << '-Xlint:all'
}

tasks.withType(Javadoc) {
    options.encoding = 'UTF-8'
    options.addBooleanOption('Xdoclint:none', true)
}
